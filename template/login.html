<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — StaffTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231a173d'/><path d='M20 70 L35 45 L50 55 L65 30 L80 40' stroke='%23f8f3e7' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a173d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StaffTrack">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
</head>

<body>
  <div class="login-page">
    <div class="login-box">

      <h1>StaffTrack</h1>
      <p class="login-sub">Sign in to your workspace</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      {% for category, message in messages %}
      <div class="alert alert-{{ 'error' if category == 'error' else 'success' }}">
        <i data-lucide="{{ 'x-circle' if category == 'error' else 'check-circle-2' }}" class="icon"></i>
        {{ message }}
      </div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group mb-4">
          <label for="email">Email address</label>
          <div class="input-icon">
            <i data-lucide="mail" class="icon"></i>
            <input type="email" id="email" name="email" class="form-control" placeholder="you@company.com" required
              autofocus>
          </div>
        </div>

        <div class="form-group mb-4">
          <label for="password">Password</label>
          <div class="input-icon">
            <i data-lucide="lock" class="icon"></i>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password"
              required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full btn-signin" style="padding:12px;margin-top:6px;">
          <i data-lucide="log-in" class="icon btn-signin-icon"></i>
          <span class="btn-signin-text">Sign In</span>
          <svg class="btn-spinner" width="20" height="20" viewBox="0 0 20 20" fill="none" style="display:none;">
            <circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40 60" />
          </svg>
        </button>
      </form>

      <p class="text-muted" style="text-align:center;margin-top:22px;font-size:.78rem;">
        Contact your administrator if you need access.
      </p>

      <button type="button" class="btn btn-ghost w-full install-app-btn" id="installAppLoginBtn" style="display:none;margin-top:14px;padding:9px;font-size:.8rem;">
        <i data-lucide="download" class="icon"></i> Install Web App
      </button>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script>
    document.querySelector('form').addEventListener('submit', function() {
      const btn = document.querySelector('.btn-signin');
      btn.disabled = true;
      btn.classList.add('is-loading');
      btn.querySelector('.btn-signin-icon').style.display = 'none';
      btn.querySelector('.btn-signin-text').textContent = 'Signing in…';
      btn.querySelector('.btn-spinner').style.display = 'inline-block';
    });
  </script>
</body>

</html>
